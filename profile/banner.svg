<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Daccred">
  <rect width="1200" height="300" fill="#0B1220"/>
  <!-- attestation seal: concentric hexes + check -->
  <g transform="translate(210,150)" stroke="#1E293B" fill="none" stroke-width="3">
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52"/>
    <polygon points="0,-78 67,-39 67,39 0,78 -67,39 -67,-39" stroke="#334155"/>
    <polygon points="0,-52 45,-26 45,26 0,52 -45,26 -45,-26" stroke="#10B981" stroke-width="4"/>
    <path d="M -20 2 L -6 16 L 24 -16" stroke="#10B981" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(990,150)" stroke="#1E293B" fill="none" stroke-width="3">
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52"/>
    <polygon points="0,-78 67,-39 67,39 0,78 -67,39 -67,-39" stroke="#334155"/>
    <circle r="7" fill="#10B981" stroke="none"/>
    <g stroke="#334155" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="-78"/><line x1="0" y1="0" x2="67" y2="39"/><line x1="0" y1="0" x2="-67" y2="39"/>
    </g>
    <g fill="#10B981" stroke="none"><circle cx="0" cy="-78" r="5"/><circle cx="67" cy="39" r="5"/><circle cx="-67" cy="39" r="5"/></g>
  </g>
  <text x="600" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" letter-spacing="12" fill="#F1F5F9">DACCRED</text>
  <text x="600" y="184" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="17" letter-spacing="5" fill="#94A3B8">HOME OF ATTEST PROTOCOL</text>
</svg>
